<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C2C4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="زين الجنوب">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>زين الجنوب · الحسابات والطلبات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: phone = top brand bar + bottom tab bar; desktop (>=1000px) = labelled side rail on the start (right) edge + wide canvas.
   Face: Zain's navy ink, the orange dot from the logo marks the active place and the sale basket; group tiles carry pale tints of their own hue. */
:root{
  --ground:#F5F6F9; --surface:#FFFFFF; --sunk:#EEF1F6; --line:#E3E7EE; --rule:#EEF1F5; --control:#CDD3DE;
  --ink:#16203A; --muted:#566079; --faint:#6A7389;
  --navy:#1C2C4E; --navy-ink:#FFFFFF; --orange:#F9A71F; --orange-ink:#1C2C4E; --orange-soft:#FFF3DC;
  --brand:#1C2C4E; --brand-soft:#E8EDF6;
  --ok:#1E7A47; --ok-bg:#DFF3E6; --warn:#8A5300; --warn-bg:#FFF1D6; --bad:#B3261E; --bad-bg:#FCE7E4;
  /* group tiles: bg / ink */
  --g1:#FFF0D2; --g1i:#6A4300; --g2:#DDEBFF; --g2i:#0A3A80; --g3:#E2F4E7; --g3i:#1C5B33;
  --g4:#F8E3EC; --g4i:#7A1F45; --g5:#EFE8D8; --g5i:#584718; --g6:#E7EAF0; --g6i:#36405A;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",system-ui,sans-serif;
  --r-card:18px; --r-ctl:12px; --r-chip:999px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1322; --surface:#151C30; --sunk:#1B2339; --line:#283250; --rule:#202942; --control:#3A4566;
    --ink:#E9EDF5; --muted:#A6B0C6; --faint:#949FB8;
    --navy:#24365E; --navy-ink:#FFFFFF; --orange:#F9A71F; --orange-ink:#1C2C4E; --orange-soft:#3A2F14;
    --brand:#F9A71F; --brand-soft:#26304C;
    --ok:#6BCB93; --ok-bg:#16301F; --warn:#F2BC5A; --warn-bg:#382B10; --bad:#F08A7E; --bad-bg:#3B1C18;
    --g1:#3A2E13; --g1i:#F6CD7E; --g2:#16294A; --g2i:#9DC2FF; --g3:#16301F; --g3i:#8FD8A8;
    --g4:#3A1B29; --g4i:#F2A9C6; --g5:#302A1A; --g5i:#E2CF9B; --g6:#232A3D; --g6i:#C3CBDD;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1322; --surface:#151C30; --sunk:#1B2339; --line:#283250; --rule:#202942; --control:#3A4566;
  --ink:#E9EDF5; --muted:#A6B0C6; --faint:#949FB8;
  --navy:#24365E; --navy-ink:#FFFFFF; --orange:#F9A71F; --orange-ink:#1C2C4E; --orange-soft:#3A2F14;
  --brand:#F9A71F; --brand-soft:#26304C;
  --ok:#6BCB93; --ok-bg:#16301F; --warn:#F2BC5A; --warn-bg:#382B10; --bad:#F08A7E; --bad-bg:#3B1C18;
  --g1:#3A2E13; --g1i:#F6CD7E; --g2:#16294A; --g2i:#9DC2FF; --g3:#16301F; --g3i:#8FD8A8;
  --g4:#3A1B29; --g4i:#F2A9C6; --g5:#302A1A; --g5i:#E2CF9B; --g6:#232A3D; --g6i:#C3CBDD;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)} .small{font-size:13px}
h1{font-size:22px;margin:2px 0 12px;line-height:1.3;text-wrap:balance}
h2{font-size:17px;margin:22px 0 10px;text-wrap:balance}
h3{font-size:16px;margin:0}
p{margin:0 0 8px}
.hidden{display:none!important}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brandmark{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brandmark .logo{height:42px;width:auto;flex:none;display:block}
.brandmark b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.brandmark small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn .dot{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:var(--orange-ink);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
main{max-width:760px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{display:flex;max-width:760px;margin:0 auto}
.nav button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"]::after{content:"";position:absolute;top:4px;inset-inline-start:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--orange)}
@media (min-width:1000px){
  body{padding-inline-start:236px}
  .top{padding-inline-start:24px}
  main{max-width:1120px;padding-inline:32px}
  .nav{top:0;bottom:0;left:auto;right:0;width:236px;border-top:0;border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
  :root[dir="rtl"] .nav,html[dir="rtl"] .nav{right:0;left:auto}
  .nav-in{flex-direction:column;gap:2px;max-width:none;margin:0}
  .nav-brand{display:flex!important;align-items:center;gap:10px;padding:0 8px 18px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:9px 12px;border-radius:10px}
  .nav button[aria-current="page"]{background:var(--sunk)}
  .nav button[aria-current="page"]::after{top:50%;inset-inline-start:auto;inset-inline-end:12px;transform:translateY(-50%)}
  .top .brandmark .logo{display:none}
}
.nav-brand{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo,:root:not([data-theme="light"]) .nav-brand img{background:#fff;border-radius:10px;padding:3px 5px}}
:root[data-theme="dark"] .logo,:root[data-theme="dark"] .nav-brand img{background:#fff;border-radius:10px;padding:3px 5px}
.nav-brand img{height:46px;width:auto}
.nav-brand b{font-size:15px;line-height:1.3}

/* buttons */
.btn{border:1px solid var(--control);background:var(--surface);border-radius:var(--r-ctl);padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none;color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.accent{background:var(--orange);border-color:var(--orange);color:var(--orange-ink);font-weight:700}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--orange) 70%,transparent);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row-head h1,.row-head h2{margin-bottom:8px}

/* panels & rows */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.panel + .panel{margin-top:12px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:start;cursor:pointer;color:inherit}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;font-size:16px;text-align:end}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
@media (min-width:600px){.seg{display:inline-flex}.seg button{flex:none}}
.search{width:100%;border:1px solid var(--control);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:12px;min-height:44px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap;flex:none}
.tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.good{background:var(--ok-bg);color:var(--ok)} .tag.brand{background:var(--brand-soft);color:var(--brand)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.warn i{background:var(--orange)} .meter.bad i{background:var(--bad)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:12px;overflow:hidden}
.stat > div{padding:12px 16px;border-inline-start:1px solid var(--rule);border-top:1px solid var(--rule);margin:-1px 0 0 -1px}
.stat small{color:var(--muted);display:block;font-size:13px}
.stat b{font-size:20px;font-weight:600}

/* home hero */
.hero{background:var(--navy);color:var(--navy-ink);border-radius:22px;padding:16px;margin-bottom:16px;display:grid;gap:12px}
.hero small{opacity:.82;font-size:13px}
.hero .big{font-size:30px;font-weight:700;line-height:1.1}
.hero .split{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;opacity:.9}
.hero .btn.accent{min-height:52px;font-size:17px;border-radius:14px}
.hero .btn.ghostlight{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff;min-height:52px;border-radius:14px}
.hero-actions{display:grid;grid-template-columns:2fr 1fr;gap:8px}

/* quick sale tiles */
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{border:0;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap;min-height:34px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{border:0;border-radius:16px;padding:11px 10px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:start;cursor:pointer;gap:6px}
.tile b{font-size:14px;line-height:1.3;font-weight:600}
.tile .p{font-size:16px;font-weight:700}
.tile .p.none{font-size:12px;font-weight:500;opacity:.8}
.tile:active{transform:scale(.97)}
.g1{background:var(--g1);color:var(--g1i)} .g2{background:var(--g2);color:var(--g2i)} .g3{background:var(--g3);color:var(--g3i)}
.g4{background:var(--g4);color:var(--g4i)} .g5{background:var(--g5);color:var(--g5i)} .g6{background:var(--g6);color:var(--g6i)}
.home-grid{display:grid;gap:4px}
.day-title{font-size:20px;margin:0 0 12px}
@media (min-width:1000px){.home-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}.home-grid h2:first-child{margin-top:0}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card ul{margin:8px 0;padding-inline-start:18px;font-size:14px}
.card .meta{font-size:13px;color:var(--muted)}
.cards{display:grid;gap:0}
@media (min-width:1000px){.cards.two{grid-template-columns:1fr 1fr;gap:0 12px}}
.qrow{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);align-items:center}
.qrow:last-child{border-bottom:0}
.qrow .grow{flex:1;min-width:0}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.week button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.week button b{font-size:17px;color:var(--ink)}
.week button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.week button[aria-pressed="true"] b{color:var(--navy-ink)}
.week .cnt{min-height:16px;font-size:11px}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--rule);text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
td.n,th.n{text-align:end}
tr.rev td{color:var(--muted);text-decoration:line-through}
tr.pend td{background:var(--warn-bg)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)} /* taste-skill-ignore: dialog floats */
.sheet.wide{max-width:860px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.sheet-h h2{margin:0}
.field{display:block;margin-bottom:12px}
.field > span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--control);background:var(--surface);border-radius:11px;padding:10px 12px;min-height:44px}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.totals{background:var(--sunk);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.totals div{display:flex;justify-content:space-between;gap:8px}
.totals .t{font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;z-index:30;max-width:92vw;font-size:15px;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--orange);font-weight:700;cursor:pointer;padding:0}
.gate{max-width:520px;margin:12vh auto;padding:24px;text-align:center}
.spin{width:18px;height:18px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
.picks{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.pick{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:84px;line-height:1.3;text-align:start}
.pick b{font-weight:600;font-size:15px}.pick span{font-size:13px;color:var(--muted)}
.pick[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.pick[aria-pressed="true"] span{color:var(--navy-ink);opacity:.8}
.pick.add{background:var(--surface);border-style:dashed;color:var(--muted)}
.chooser{margin-bottom:14px}
.chooser > span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:500}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--control);border-radius:11px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--sunk);width:40px;height:40px;font-size:20px;cursor:pointer}
.qty-in{width:64px;height:40px;border:0;border-inline:1px solid var(--line);background:var(--surface);text-align:center;font-weight:600;font-size:15px;color:var(--ink)}
details.extras{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
details.extras summary{cursor:pointer;color:var(--muted);font-weight:500}
.line{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface)}
.line-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.line-h b{font-size:15px}
.optrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.opt{border:1px solid var(--control);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;min-height:34px}
.opt[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.paybtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.paybtns .btn{min-height:58px;font-size:17px;font-weight:700;border-radius:14px}
.bigamt{width:100%;font-size:34px;font-weight:700;text-align:center;border:2px solid var(--control);border-radius:16px;padding:10px;background:var(--surface);direction:ltr}
.bigamt:focus{border-color:var(--orange);outline:none}
.fileinput{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{position:relative;cursor:pointer}
.thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--sunk);flex:none;display:grid;place-items:center;color:var(--muted)}
.inv-img{display:block;width:100%;max-height:300px;object-fit:contain;background:var(--sunk);border-radius:12px;margin-bottom:12px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk)}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph button{position:absolute;top:4px;inset-inline-start:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.alert-row{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--rule);align-items:flex-start}
.alert-row:last-child{border-bottom:0}
.alert-row.unread{background:var(--orange-soft)}
.cmd{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;align-items:flex-end}
.cmd textarea{flex:1;border:0;background:transparent;resize:none;min-height:44px;max-height:140px;padding:9px 8px;outline:none;color:var(--ink);font-size:16px}
.draft{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--orange);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.draft.bad{border-inline-start-color:var(--bad)}
.draft dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 10px;font-size:15px}
.draft dt{color:var(--muted)} .draft dd{margin:0;font-weight:500}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.basket{position:fixed;inset-inline:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;justify-content:center;padding:0 16px}
.morelist .row svg{width:22px;height:22px;color:var(--muted);flex:none}
@media (min-width:1000px){.basket{bottom:16px;padding-inline-start:236px}}
</style>

function party(id){return S.parties.find(p=>p.id===id)}

function eff(t){return t.status==="ok"}
let BAL=null,BALV=-1;
function balMap(){if(BAL&&BALV===S.ver)return BAL;BAL={};for(const t of S.tx)if(eff(t))BAL[t.partyId]=(BAL[t.partyId]||0)+t.sign*num(t.amount);BALV=S.ver;return BAL}
function balance(pid){return r2(num(finOf(pid).opening)+(balMap()[pid]||0))}
function partyTx(pid){return S.tx.filter(t=>t.partyId===pid).sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt))}
function balanceBefore(pid,date){let b=num(finOf(pid).opening);for(const t of S.tx)if(t.partyId===pid&&eff(t)&&t.date<date)b+=t.sign*num(t.amount);return r2(b)}
function monthWithdraw(pid,m){m=m||ym();return r2(S.tx.filter(t=>t.partyId===pid&&eff(t)&&ym(t.date)===m).reduce((s,t)=>s+t.sign*num(t.amount),0))}
function wLimit(pid){const v=num(payOf(pid).wLimit);return v<0?0:(v||1500)}
function vipLimit(pid){return num(finOf(pid).limit)}
function vipUse(p){const lim=vipLimit(p.id);if(!lim)return 0;return balance(p.id)/lim}
function level(ratio){return ratio>=1?"bad":ratio>=0.8?"warn":""}
function vatRate(){return S.config.vatOn===false?0:(num(S.config.vatRate)||15)}
function allPay(){return Object.entries(S.desk).flatMap(([u,d])=>(d.pay||[]).map(x=>({...x,uid:u})))}
function allSales(){return Object.entries(S.desk).flatMap(([u,d])=>(d.sales||[]).map(x=>({...x,uid:u})))}
function allBills(){return Object.entries(S.desk).flatMap(([u,d])=>(d.bills||[]).map(x=>({...x,uid:u})))}
function pendingReqs(pid){return allPay().filter(r=>r.status==="pending"&&(!pid||r.partyId===pid))}
function pendingSum(pid){return r2(pendingReqs(pid).reduce((s,r)=>s+num(r.amount),0))}
function apptPaidTx(id){return r2(S.tx.filter(t=>t.apptId===id&&eff(t)&&t.type==="payment"&&!t.reversedBy).reduce((s,t)=>s+num(t.amount),0))}
function apptPaid(a){return isAcc()?apptPaidTx(a.id):r2(num(a.paid))}
function apptPending(a){return r2(allPay().filter(r=>r.apptId===a.id&&r.status==="pending").reduce((s,r)=>s+num(r.amount),0))}
function apptLabel(a){return `${a.date} · ${(a.items||[]).map(i=>i.name).slice(0,2).join("، ")}${(a.items||[]).length>2?"…":""}`}
function hasLetters(items){return (items||[]).some(i=>i.group===LETTERS||(!i.group&&/حروف/.test(i.name||"")))}
function lineTotal(i){return r2(num(i.qty||1)*num(i.price))}
function lineInstall(i){return i.install==="with"?r2(num(i.installPrice)):0}
function calcTotals(items,rate){const vr=rate==null?vatRate():num(rate);const sub=r2((items||[]).reduce((s,i)=>s+lineTotal(i)+lineInstall(i),0));const vat=r2(sub*vr/100);return {sub,vat,total:r2(sub+vat)}}

/* ============ reconciler: admin sessions keep the ledger in step with orders ============ */
let recT=null;const recBusy=new Set();
function scheduleReconcile(){if(!isAcc())return;clearTimeout(recT);recT=setTimeout(()=>reconcile().catch(e=>console.warn("reconcile",e)),1500)}
async function reconcile(){
  if(!(S.loaded.tx&&S.loaded.appts&&S.loaded.parties&&S.loaded.fin))return;
  for(const a of S.appts){
    if(recBusy.has(a.id))continue;
    const p=party(a.clientId);if(!p)continue;
    const inv=a.invoiceTx?S.tx.find(t=>t.id===a.invoiceTx):null;
    try{
      recBusy.add(a.id);
      if(a.status==="cancelled"){
        if(inv&&!inv.reversedBy)await reverseTx(inv,"إلغاء الطلب");
      }else if(a.approval!=="pending"){
        const total=r2(num(a.total));
        if(!a.invoiceTx&&total>0){
          if(p.kind==="vip"&&vipLimit(p.id)>0&&a.approval!=="ok"&&balance(p.id)+total>vipLimit(p.id)){
            await col("appts").doc(a.id).update({approval:"pending"});
            await alertOnce("ap-"+a.id,{type:"approval",partyId:p.id,text:`طلب ${p.name} بقيمة ${fmt(total)} يتجاوز سقف الدين وينتظر اعتمادك`});
          }else{
            const rev=num(a.invRev);const id=`inv-${a.id}-${rev}`;
            if(!S.tx.find(t=>t.id===id))await writeTx({partyId:a.clientId,type:"invoice",sign:1,amount:total,date:a.date,note:`طلب ${a.date}: ${(a.items||[]).map(i=>i.name).join("، ").slice(0,120)}`,apptId:a.id,label:"فاتورة طلب"},id);
            await col("appts").doc(a.id).update({invoiceTx:id,approval:"ok"});
          }
        }else if(inv&&!inv.reversedBy&&r2(inv.amount)!==total){
          await reverseTx(inv,"تعديل الطلب");
          const rev=num(a.invRev)+1;const id=`inv-${a.id}-${rev}`;
          if(total>0){await writeTx({partyId:a.clientId,type:"invoice",sign:1,amount:total,date:a.date,note:`طلب ${a.date} (معدّل)`,apptId:a.id,label:"فاتورة طلب"},id);await col("appts").doc(a.id).update({invoiceTx:id,invRev:rev})}
          else await col("appts").doc(a.id).update({invoiceTx:null,invRev:rev});
        }
      }
      // paid summary for staff screens + "ready for warranty" alert
      const paid=apptPaidTx(a.id);
      if(r2(num(a.paid))!==paid)await col("appts").doc(a.id).update({paid});
      if(a.status==="done"&&!a.warrantyId&&hasLetters(a.items)&&num(a.total)>0&&paid>=r2(num(a.total))-0.004)
        await alertOnce("wr-"+a.id,{type:"warranty",partyId:a.clientId,apptId:a.id,text:`طلب ${p.name} سُدّد بالكامل، أصدر ورقة الضمان`});
    }catch(e){console.warn("reconcile appt",a.id,e)}finally{recBusy.delete(a.id)}
  }
}

function writeErr(e){console.error(e);if(e&&e.code==="permission-denied")toast("ليست لديك صلاحية لهذا الإجراء");else toast("تعذّر الحفظ")}
function wrapDoc(ref){return {id:ref.id,path:ref.path,_ref:ref,
  get:()=>ref.get().catch(()=>ref.get({source:"cache"})),
  set:d=>{ref.set(clean(d)).catch(writeErr);return Promise.resolve()},
  update:d=>{ref.update(clean(d)).catch(writeErr);return Promise.resolve()},
  delete:()=>{ref.delete().catch(writeErr);return Promise.resolve()},
  onSnapshot:(cb,err)=>ref.onSnapshot(cb,err),
  collection:n=>wrapQuery(ref.collection(n))}}
function wrapQuery(q){return {_q:q,
  where:(a,o,v)=>wrapQuery(q.where(a,o,v)),orderBy:(a,d)=>wrapQuery(q.orderBy(a,d)),limit:n=>wrapQuery(q.limit(n)),
  doc:id=>wrapDoc(id?q.doc(id):q.doc()),
  add:d=>{const r=q.doc();r.set(clean(d)).catch(writeErr);return Promise.resolve(wrapDoc(r))},
  get:()=>q.get().catch(()=>q.get({source:"cache"})),
  onSnapshot:(cb,err)=>q.onSnapshot(cb,err)}}
function clean(o){if(Array.isArray(o))return o.map(clean);if(o&&typeof o==="object"&&!(o instanceof Date)){const r={};for(const [k,v] of Object.entries(o))if(v!==undefined)r[k]=clean(v);return r}return o}
const DBX={doc:p=>wrapDoc(FS.doc(p)),collection:p=>wrapQuery(FS.collection(p))};

/* images live in Firestore as compressed data URLs (no paid storage needed) */
const BLOBS={},BLOBP={};
const PIX="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
function blobSrc(id){if(!id)return PIX;if(BLOBS[id])return BLOBS[id];if(!BLOBP[id]){BLOBP[id]=FS.doc("blobs/"+id).get().then(s=>{if(s.exists){BLOBS[id]=s.data().d;scheduleRender()}}).catch(()=>{delete BLOBP[id]})}return PIX}
async function ensureBlobs(ids){await Promise.all([...new Set(ids.filter(Boolean))].map(id=>BLOBS[id]?0:FS.doc("blobs/"+id).get().then(s=>{if(s.exists)BLOBS[id]=s.data().d}).catch(()=>{})))}
function readAsDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
async function fitImage(blob,max=1500,q=0.75){let out=blob;for(const [m,qq] of [[max,q],[1200,0.68],[1000,0.6],[800,0.55]]){out=await shrinkImage(blob,m,qq);if(out.size<=650*1024)break}return out}
const ASSETS={
  async upload(blob){
    let b=blob;
    if(/^image\//.test(b.type||"")||!b.type)b=await fitImage(b);
    if(b.size>740*1024)throw new Error("too big");
    const d=await readAsDataURL(b);const id=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
    BLOBS[id]=d;FS.doc("blobs/"+id).set({d,t:b.type||"",s:b.size,at:nowISO(),by:S.uid||null}).catch(writeErr);
    return {id,url:d};
  },
  async delete(id){delete BLOBS[id];FS.doc("blobs/"+id).delete().catch(()=>{})}
};

async function importData(file){

  if(!(await askConfirm("استيراد البيانات",`سيُضاف ${Object.values(data).reduce((n,c)=>n+Object.keys(c).length,0)} سجلاً. تأكد أنك لم تستورد الملف من قبل.`,"استيراد")))return;

    const net=r2(num(c.amount)-num(c.vat));
    for(const it of its){
      let p=num(it.price);if(!p&&its.length===1&&net>0)p=r2(net/(num(it.qty)||1));if(!(p>0))continue;
      const k=norm(it.name);const e=by[k]=by[k]||{name:it.name,list:{}};const s=c.supplierName||"—";

const BK_ARR=["parties","tx","items","appts","quotes","cash","workdocs","warranties","taxinv","safe","portals","users"],BK_MAP=["fin","payroll","closings","statements"];
function backupData(){
  const o={};const strip=d=>{const {id,...r}=d;return r};
  for(const k of BK_ARR){o[k]={};for(const d of S[k]||[])o[k][d.id]=strip(d)}
  for(const k of BK_MAP)o[k]={...(S[k]||{})};
  o.config={main:S.config||{}};o.meta={main:S.meta||{}};
  return o;
}
async function makeBackup(auto){
  const json=JSON.stringify(backupData());const parts=[];for(let i=0;i<json.length;i+=650000)parts.push(json.slice(i,i+650000));
  const id=today()+"_"+Math.random().toString(36).slice(2,6);
  for(let i=0;i<parts.length;i++)await FS.doc(`backups/${id}/parts/${i}`).set({d:parts[i]});
  await FS.doc("backups/"+id).set({at:nowISO(),by:S.uid,parts:parts.length,size:json.length,auto:!!auto});
  await FS.doc("meta/main").set({lastAutoBackup:nowISO()},{merge:true});
  const old=[...(S.backups||[])].sort((a,b)=>(b.at||"").localeCompare(a.at||"")).slice(5);
  for(const b of old){for(let i=0;i<num(b.parts);i++)FS.doc(`backups/${b.id}/parts/${i}`).delete().catch(()=>{});FS.doc("backups/"+b.id).delete().catch(()=>{})}
  addLog("نسخة احتياطية",auto?"تلقائية":"يدوية");return id;
}
let bkTried=false;
function maybeAutoBackup(){
  if(bkTried||!isAcc()||!navigator.onLine)return;
  if(!["tx","appts","parties","cash","safe","meta","backups"].every(k=>S.loaded[k]))return;
  bkTried=true;const last=S.meta.lastAutoBackup;
  if(last&&Date.now()-new Date(last).getTime()<7*864e5)return;
  setTimeout(()=>makeBackup(true).catch(e=>console.warn("backup",e)),15000);
}

}
function asciiOnly(s){return normDigits(String(s||"")).replace(/[^\x20-\x7E]/g,"").trim()}
function imgToJpeg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{try{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0);res({data:c.toDataURL("image/jpeg",0.85),w:c.width,h:c.height})}catch(e){rej(e)}};im.onerror=rej;im.src=src})}
async function invoicesPDF(rows,title,filename){
  if(!window.html2pdf){toast("أداة PDF لم تُحمَّل");return false}
  rows=[...rows].sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));
  const sum=r2(rows.reduce((s,c)=>s+num(c.amount),0)),vsum=r2(rows.reduce((s,c)=>s+num(c.vat),0));
  const body=rows.map((c,i)=>`<tr><td ${TD}>${i+1}</td><td ${TD}>${c.date}</td><td ${TD}>${esc(c.supplierName||"—")}${c.summary?"<br><span style='color:#555;font-size:11px'>"+esc(c.summary)+"</span>":""}</td><td ${TD}>${esc(c.number||"")}</td><td ${TD}>${c.pay==="credit"?"آجل":"نقداً"}</td><td ${TD}>${fmt(c.vat)}</td><td ${TD}>${fmt(c.amount)}</td></tr>`).join("");
  const html=pdfShell(pdfHeader(title,`عدد الفواتير: ${rows.length}`)+`<table style="width:100%;border-collapse:collapse"><thead><tr><th ${TH}>#</th><th ${TH}>التاريخ</th><th ${TH}>المورد</th><th ${TH}>رقم الفاتورة</th><th ${TH}>الدفع</th><th ${TH}>الضريبة</th><th ${TH}>المبلغ</th></tr></thead><tbody>${body}
    <tr><td ${TD}></td><td ${TD}></td><td ${TD}><b>الإجمالي</b></td><td ${TD}></td><td ${TD}></td><td ${TD}><b>${fmt(vsum)}</b></td><td ${TD}><b>${fmt(sum)}</b></td></tr></tbody></table>
    <div style="margin-top:10px;font-size:12px;color:#555">صور الفواتير في الصفحات التالية بنفس الترقيم.</div>`);
  const holder=el("div",{style:"position:fixed;top:0;left:-10000px;width:820px;background:#fff"});holder.innerHTML=html;document.body.append(holder);
  toast("جارٍ تجهيز الملف…");
  try{
    const pdf=await html2pdf().set({margin:[8,6,10,6],image:{type:"jpeg",quality:0.95},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:"tr"}}).from(holder.firstElementChild).toPdf().get("pdf");
    let missing=0;
    for(let i=0;i<rows.length;i++){
      const c=rows[i];if(!c.imageId||c.imageDeleted)continue;
      let im;try{await ensureBlobs([c.imageId]);im=await imgToJpeg(BLOBS[c.imageId])}catch(e){missing++;continue}
      pdf.addPage();
      const W=210,H=297,mg=10,top=16,maxW=W-2*mg,maxH=H-top-mg;let w=maxW,h=im.h*w/im.w;if(h>maxH){h=maxH;w=im.w*h/im.h}
      pdf.setFontSize(10);pdf.setTextColor(28,44,78);
      pdf.text(asciiOnly(`#${i+1}    ${c.date}    ${fmt(c.amount)} SAR${c.number?"    No. "+c.number:""}`),mg,10);
      pdf.addImage(im.data,"JPEG",(W-w)/2,top,w,h);
    }
    if(missing)toast(`تعذّر تحميل ${missing} صورة`);
    return await saveFile(filename,pdf.output("blob"));
  }catch(e){console.error(e);toast("تعذّر إنشاء الملف");return false}finally{holder.remove()}
}
async function monthPDF(m){
  const ok=await invoicesPDF(cashLive(m),`فواتير المشتريات · ${m}`,`فواتير-مشتريات-${m}.pdf`);
  if(ok){await S.db.doc("meta/main").set({...S.meta,cashArchive:{...(S.meta.cashArchive||{}),[m]:nowISO()}});addLog("PDF",`فواتير المشتريات لشهر ${m}`)}
}
async function wipeMonthImages(m){
  const rows=S.cash.filter(c=>ym(c.date)===m&&(c.imageId||c.fileId)&&!c.imageDeleted&&c.status!=="review");
  if(!rows.length)return;
  if(!await askConfirm("حذف صور الشهر",`ستُحذف ${rows.length} صورة فاتورة لشهر ${m} نهائياً. تبقى بيانات الفواتير في النظام، والصور محفوظة في ملف PDF الذي نزّلته.`,"حذف"))return;
  let n=0;toast("جارٍ الحذف…");
  for(const c of rows){for(const id of [c.imageId,c.fileId].filter(Boolean)){try{await S.assets.delete(id)}catch(e){}} try{await col("cash").doc(c.id).update({imageDeleted:true,imageDeletedAt:nowISO()});n++}catch(e){}}
  addLog("حذف صور",`${n} صورة فاتورة لشهر ${m} بعد أرشفتها PDF`);toast(`حُذفت ${n} صورة`);
}

async function sendChat(){
  const cb=getChatBox();const text=cb.ta.value.trim();if(!text||S.busy)return;
  if(!S.sample){toast("فهم الأوامر غير متاح الآن. استخدم الأزرار.");return}
  S.busy=true;cb.btn.replaceChildren(el("span",{class:"spin"}));cb.btn.disabled=true;
  const plist=(isAcc()?S.parties:S.parties.filter(p=>p.kind==="client"||p.kind==="vip")).map(p=>`${p.name}|${p.kind}`).join("\n")||"(لا يوجد)";
  const ilist=S.items.map(i=>`${i.name}|${i.group||""}|${i.priceMode==="manual"?"يدوي":i.price}`).join("\n")||"(لا يوجد)";
  const roleNote=isAcc()?"":"\nالمستخدم موظف مواعيد: المسموح فقط op=appt و op=tx بنوع payment لعميل أو عميل مميز. أي شيء آخر أعده op=unknown مع رسالة أن هذا من صلاحية الحسابات.";
  const prompt=`أنت محلل أوامر لتطبيق حسابات وطلبات لوكالة دعاية سعودية. حوّل نص المستخدم إلى JSON فقط.
تاريخ اليوم: ${today()} (${dayName(today())}).
الأطراف (الاسم|النوع):
${plist}
الأصناف (الاسم|المجموعة|السعر قبل الضريبة):
${ilist}
الأنواع: supplier=مورد، client=عميل، vip=عميل مميز، worker=عامل.
أعد: {"actions":[...]} وكل عنصر واحد من:
{"op":"tx","party":"الاسم","kind":"supplier|client|vip|worker","type":"...","amount":رقم,"method":"cash|transfer|card|null","note":"","date":"YYYY-MM-DD"}
  method: card = شبكة أو مدى، transfer = تحويل، cash = كاش
  type للمورد: purchase أو payment. للعميل والمميز: invoice أو payment. للعامل: withdraw أو ret
{"op":"party","name":"","kind":"supplier|client|vip|worker","phone":""}
{"op":"appt","client":"الاسم","date":"YYYY-MM-DD","time":"HH:MM أو فارغ","location":"","items":[{"name":"","qty":1,"price":رقم,"install":"with|without|null","thick":رقم أو null}]}
{"op":"unknown","message":"شرح قصير لما ينقص"}
قواعد: طابق الأسماء مع القوائم واكتبها كما هي. إذا لم يُذكر سعر صنف ثابت فخذه من القائمة، وإن كان يدوياً فاجعل price 0. حوّل الأرقام العربية. "بكرة"=غداً. التاريخ الافتراضي اليوم. إذا ذكر عدة عمليات فأعدها كلها.${roleNote}
النص: ${text}`;
  try{
    const res=await S.sample.json(prompt,{modelTier:"default",cache:false});
    const acts=Array.isArray(res?.actions)?res.actions:[];
    if(!acts.length)toast("لم أفهم الأمر، جرّب صياغة أوضح");
    for(const a of acts)S.drafts.unshift(prepDraft(a,text));
    cb.ta.value="";cb.ta.style.height="auto";
  }catch(e){toast(e&&e.code==="not_granted"?"أضف مفتاح Gemini من الإعدادات":e&&e.code==="rate_limited"?"طلبات كثيرة، انتظر قليلاً":"تعذّر فهم الأمر")}
  finally{S.busy=false;cb.btn.replaceChildren(icon("send",18));cb.btn.disabled=false;render()}
}
let draftSeq=0;
function prepDraft(a,src){
  const d={id:++draftSeq,a,src,err:null,newParty:null};
  if(a.op==="unknown"){d.err=a.message||"لم أفهم الأمر";return d}
  if(!isAcc()&&!(a.op==="appt"||(a.op==="tx"&&a.type==="payment"&&(a.kind==="client"||a.kind==="vip")))){d.err="هذه العملية من صلاحية الحسابات";return d}
  if(a.op==="tx"){
    let p=findParty(a.party,a.kind?[a.kind]:null)||findParty(a.party);
    if(p){d.partyId=p.id;a.kind=p.kind}
    else if(isAcc()&&KIND1[a.kind])d.newParty={name:a.party,kind:a.kind};
    else{d.err=`لم أجد "${a.party||"؟"}" في القائمة`;return d}
    if(!TYPES[a.kind]?.[a.type]){d.err="نوع العملية غير واضح";return d}
    if(!(num(a.amount)>0)){d.err="المبلغ غير واضح";return d}
  }
  if(a.op==="appt"){
    const p=findParty(a.client,["client","vip"]);
    if(p)d.partyId=p.id;else if(a.client)d.newParty={name:a.client,kind:"client"};else{d.err="اسم العميل غير واضح";return d}
    a.items=(a.items||[]).slice(0,20).map(i=>{const f=S.items.find(x=>norm(x.name)===norm(i.name));const base=f?cartLineFromItem(f):{itemId:null,name:String(i.name||"").trim(),group:"",unit:"",qty:1,price:0,specs:[],desc:"",note:"",canThick:false,canSize:false,opts:[],opt:"",canInstall:true,install:null};
      base.qty=num(i.qty)||1;if(num(i.price)>0)base.price=r2(num(i.price));if(i.install==="with"||i.install==="without")base.install=i.install;if(num(i.thick)&&base.canThick)base.thick=num(i.thick);return base}).filter(i=>i.name);
    if(!a.items.length){d.err="لم أجد أصنافاً في الطلب";return d}
  }
  if(a.op==="party"&&!KIND1[a.kind]){d.err="نوع الطرف غير واضح";return d}
  if(a.op==="party"&&findParty(a.name,[a.kind])){d.err=`"${a.name}" موجود مسبقاً`;return d}
  return d;
}
function draftCard(d){
  const a=d.a;const rows=[];
  const add=(k,v)=>{if(v!==""&&v!=null)rows.push(el("dt",{},k),el("dd",{},v))};
  if(d.err)return el("div",{class:"draft bad"},el("b",{},"لم تُنفّذ"),el("p",{class:"small muted",style:"margin:4px 0"},`"${d.src}"`),el("p",{},d.err),el("button",{class:"btn sm",onclick:()=>dropDraft(d)},"إغلاق"));
  let title="";
  if(a.op==="tx"){const p=party(d.partyId);title=TYPES[a.kind][a.type].l;add("الاسم",p?p.name:a.party+" (جديد)");add("المبلغ",money(a.amount));add("التاريخ",a.date||today());add("الطريقة",METHOD[a.method]);add("ملاحظة",a.note);if(!isAcc())add("الحالة","معلّقة حتى تأكيد المحاسب")}
  if(a.op==="party"){title="إضافة "+KIND1[a.kind];add("الاسم",a.name);add("الجوال",a.phone)}
  if(a.op==="appt"){const p=party(d.partyId);const t=calcTotals(a.items);title="طلب جديد";add("العميل",p?p.name:a.client+" (جديد)");add("التاريخ",(a.date||today())+(a.time?" · "+a.time:""));add("الموقع",a.location);add("الأصناف",a.items.map(i=>`${i.name} ${fmt(i.qty)}×${i.price?fmt(i.price):"؟"}`).join("، "));add("الإجمالي",money(t.total))}
  const needEdit=a.op==="appt"&&a.items.some(i=>!(num(i.price)>0));
  return el("div",{class:"draft"},el("b",{},title),el("dl",{},rows),
    el("div",{class:"actions"},needEdit?null:el("button",{class:"btn sm primary",onclick:e=>{e.target.disabled=true;execDraft(d)}},"تأكيد وحفظ"),
      (a.op==="tx"&&d.partyId)||a.op==="appt"?el("button",{class:"btn sm"+(needEdit?" primary":""),onclick:()=>editDraft(d)},needEdit?"أكمل الأسعار":"تعديل"):null,
      el("button",{class:"btn sm ghost",onclick:()=>dropDraft(d)},"إلغاء")));
}
function dropDraft(d){S.drafts=S.drafts.filter(x=>x!==d);render()}
async function ensureParty(d){if(d.partyId)return d.partyId;d.partyId=await createParty({...d.newParty});return d.partyId}
async function execDraft(d){
  const a=d.a;
  try{
    if(a.op==="tx"){const pid=await ensureParty(d);const t=TYPES[a.kind][a.type];
      if(a.type==="payment"&&(a.kind==="client"||a.kind==="vip"))await recordClientPayment({partyId:pid,amount:a.amount,method:METHOD[a.method]?a.method:null,note:a.note,date:a.date});
      else await writeTx({partyId:pid,type:a.type,sign:t.s,amount:a.amount,date:a.date||today(),note:a.note,method:METHOD[a.method]?a.method:null,label:t.l})}
    if(a.op==="party")await createParty({kind:a.kind,name:a.name,phone:a.phone});
    if(a.op==="appt"){const pid=await ensureParty(d);await saveAppt({clientId:pid,date:a.date||today(),time:a.time||"",location:a.location||"",team:"",notes:"",items:a.items.map(cleanLine)},null)}
    S.drafts=S.drafts.filter(x=>x!==d);if(a.op!=="appt")toast("تم الحفظ");render();
  }catch(e){console.error(e);toast("تعذّر الحفظ");render()}
}
function editDraft(d){
  const a=d.a;S.drafts=S.drafts.filter(x=>x!==d);render();
  if(a.op==="tx")txForm({partyId:d.partyId,type:a.type,amount:a.amount,date:a.date,method:a.method,note:a.note});
  if(a.op==="appt")orderForm({clientId:d.partyId||null,newClientName:d.newParty?.name||"",date:a.date,time:a.time,location:a.location,items:a.items.map(cleanLine)});
}
